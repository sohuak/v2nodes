name: 自动同步脚本更新

# ============================================================
# 已停用（2026-10-25）
# 原因：每月自动从上游 ttm533/v2nodes 合并，会覆盖本仓库对 main.py 的修改。
# 文件保留仅供以后参考。下面两处改动用于禁止执行：
#   1. 注释掉 schedule，取消自动定时触发；
#   2. 在 sync 任务上加 if: false，即使手动触发也不会运行。
# 如需恢复：取消 schedule 的注释，并删除 sync 任务下的 if: false 这一行。
# ============================================================
on:
  # schedule:
  #   - cron: '0 0 1 * *'  # 每月的第一天凌晨 12 点自动同步
  workflow_dispatch:  # 支持手动触发（当前被下面的 if: false 拦截）

jobs:
  sync:
    if: false  # 已停用：禁止执行，保留文件供以后参考
    runs-on: ubuntu-latest
    steps:
      # 检出 fork 仓库
      - name: Checkout the fork repository
        uses: actions/checkout@v3
        with:
          ref: main  # 确保同步的是主分支

      # 设置 Git 配置
      - name: Set Git global config
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # 添加主项目为上游仓库
      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/ttm533/v2nodes.git
          git fetch upstream

      # 合并主项目的最新提交到 fork 仓库
      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --no-edit

      # 推送合并后的更改到 fork 仓库
      - name: Push changes to fork
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
